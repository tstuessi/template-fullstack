[project]
name = "fullstack-template"
version = "0.1.0"
description = "Barebones FastAPI + React full-stack template"
readme = "README.md"
requires-python = ">=3.13"
# Populated by ./setup.sh (`uv add ...`) — intentionally empty here so
# this template never ships pinned-stale versions. See README.md.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
# Populated by ./setup.sh (`uv add --dev ...`).
dev = []

[tool.ruff]
exclude = ["frontend"]
line-length = 120

[tool.mypy]
exclude = ["frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
norecursedirs = ["frontend", "node_modules", ".git", ".tox", "dist", "build"]
asyncio_mode = "auto"
