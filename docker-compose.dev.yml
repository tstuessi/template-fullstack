services:
  postgres:
    image: postgres:18
    # Hardcoded, non-secret dev-only credentials -- no real secret to
    # protect (throwaway local DB, not reachable outside this compose
    # network), and `task dev` needs zero setup.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    ports:
      - "5432:5432"
    # Postgres 18+ images store data under a major-version subdirectory
    # of /var/lib/postgresql itself now, not .../data directly --
    # mounting at .../data breaks on first boot (docker-library/
    # postgres#1259). Mount the parent instead.
    volumes:
      - fullstack-template-dev-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/app_dev
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: sh -c "uv sync && uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  fullstack-template-dev-pgdata:

networks:
  default:
    name: fullstack-template-dev
